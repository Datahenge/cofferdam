# Example cofferdam policy for a STAGING environment.
#
# This file is the *execution authority* for outbound side effects on this
# environment. It lives on the local filesystem (typically
# sites/{site_name}/environment_policy.toml) and is NOT restored from a
# Production database backup. See docs/03-policy-file-format.md.

environment = "staging"
default_decision = "deny"

[mail]
mode = "sink"
sink = "mailpit"
allow_domains = ["example.internal"]

# --- Vendor API: Windmill sandbox only ---------------------------------------
[credentials.windmill_default]
profile = "staging"
secret_env = "WINDMILL_API_KEY"

[integrations.windmill]
enabled = true
kind = "vendor_api"
credential = "windmill_default"
allowed_hosts = ["sandbox.windmill.dev"]
allowed_methods = ["GET", "POST"]
allowed_operations = ["read", "write"]

# --- Payment: authorize against the sandbox, never capture -------------------
[credentials.stripe_default]
profile = "sandbox"
secret_env = "STRIPE_SANDBOX_SECRET_KEY"

[integrations.stripe]
enabled = true
kind = "payment"
credential = "stripe_default"
allowed_hosts = ["api.stripe.com"]
allow_authorize = true
allow_capture = false

# --- Object storage: non-secret settings and a multi-part credential ----------
# `configs.*` holds structured, environment-specific settings that are NOT
# secret; `credentials.*` holds only where the key material comes from
# (ADR-0014). The two are resolved independently by the application.
[configs.object_store_staging]
endpoint_url = "https://s3.staging.example.internal"
bucket_name = "example-erpnext-staging"
region_name = "auto"
attachment_prefix = "sites/staging/attachments/"
presigned_get_expiry_seconds = 300
delete_on_file_delete = false

[credentials.object_store_keys]
profile = "staging"

# A credential carrying a related pair of secrets (BR-SECRET-004).
[credentials.object_store_keys.env]
access_key_id = "OBJECT_STORE_ACCESS_KEY_ID"
secret_access_key = "OBJECT_STORE_SECRET_ACCESS_KEY"

[integrations.object_store]
enabled = true
kind = "file_transfer"
credential = "object_store_keys"
config = "object_store_staging"
allowed_hosts = ["s3.staging.example.internal"]
allowed_methods = ["GET", "PUT", "DELETE"]
allowed_operations = ["upload", "download", "delete"]

# --- Scoped effect rules -----------------------------------------------------
[effects.email.customer]
enabled = false

[effects.email.internal]
enabled = true
allow_domains = ["example.internal"]

[effects.scheduled_reports.external]
enabled = false
